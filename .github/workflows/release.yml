# Publish a GitHub Release for a version tag. Push `vX.Y.Z` where X.Y.Z is
# the workspace version in Cargo.toml. Velopack packages the app; installed
# copies find the release and update themselves (crates/blink/src/updater.rs).
#
# The app is signed with a Developer ID Application certificate and
# notarized with an App Store Connect API key. Repository secrets:
#   MACOS_CERT_P12       the certificate and its key, a .p12 in base64
#   MACOS_CERT_PASSWORD  the .p12 password
#   MACOS_SIGN_IDENTITY  the certificate name, "Developer ID Application: …"
#   NOTARY_KEY_P8        the API key file, AuthKey_<id>.p8
#   NOTARY_KEY_ID        the API key id
#   NOTARY_ISSUER_ID     the API key issuer id
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_URL: https://github.com/${{ github.repository }}
      KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
      NOTARY_PROFILE: blink-notary
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes list the commits since the previous tag.
          fetch-depth: 0

      - name: Check that the tag is the crate version
        run: |
          version=$(cargo pkgid -p blink | sed 's/.*[#@]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the crate version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build the app bundle
        run: BLINK_UNIVERSAL=1 script/bundle-macos

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > notes.md

      # A keychain for this run only, with the certificate and the notary
      # credentials. It is deleted at the end.
      - name: Set up signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/notary.p8"

      # The previous release lets vpk make a small delta package. The first
      # release has none.
      - name: Download the previous release
        run: vpk download github --repoUrl "$REPO_URL" --token "$GITHUB_TOKEN" --outputDir releases || true

      # The portable zip only: no .pkg installer, so no installer certificate.
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: >
          vpk pack
          --packId Blink
          --packVersion "$VERSION"
          --packDir target/release/Blink.app
          --mainExe blink
          --packTitle Blink
          --packAuthors "Kyle Dougan"
          --releaseNotes notes.md
          --outputDir releases
          --noInst
          --signAppIdentity "$MACOS_SIGN_IDENTITY"
          --notaryProfile "$NOTARY_PROFILE"
          --keychain "$KEYCHAIN"

      - name: Publish
        run: >
          vpk upload github
          --repoUrl "$REPO_URL"
          --token "$GITHUB_TOKEN"
          --outputDir releases
          --publish
          --releaseName "Blink $VERSION"
          --tag "$GITHUB_REF_NAME"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
